<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" rx="14" fill="url(#qr-grad)" />
  <!-- Finder Top-Left -->
  <rect x="8" y="8" width="14" height="14" rx="3" stroke="#FFFFFF" stroke-width="2.5" fill="none" />
  <rect x="12" y="12" width="6" height="6" rx="1.5" fill="#EC3D8E" />
  <!-- Finder Top-Right -->
  <rect x="26" y="8" width="14" height="14" rx="3" stroke="#FFFFFF" stroke-width="2.5" fill="none" />
  <rect x="30" y="12" width="6" height="6" rx="1.5" fill="#EC3D8E" />
  <!-- Finder Bottom-Left -->
  <rect x="8" y="26" width="14" height="14" rx="3" stroke="#FFFFFF" stroke-width="2.5" fill="none" />
  <rect x="12" y="30" width="6" height="6" rx="1.5" fill="#EC3D8E" />
  <!-- QR Data Dots -->
  <rect x="26" y="26" width="4" height="4" rx="1" fill="#FFFFFF" />
  <rect x="34" y="26" width="6" height="4" rx="1" fill="#EC3D8E" />
  <rect x="26" y="34" width="4" height="6" rx="1" fill="#EC3D8E" />
  <rect x="34" y="34" width="6" height="6" rx="1.5" fill="#FFFFFF" />
  <defs>
    <linearGradient id="qr-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2D123D" />
      <stop offset="1" stop-color="#140921" />
    </linearGradient>
  </defs>
</svg>