<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-comp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B0C26" />
      <stop offset="50%" stop-color="#100517" />
      <stop offset="100%" stop-color="#07020A" />
    </linearGradient>
    <radialGradient id="glow-comp" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#EC3D8E" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="photo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC3D8E" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="270" fill="url(#bg-comp)" />
  <circle cx="240" cy="115" r="135" fill="url(#glow-comp)" />

  <!-- Grid decoration lines -->
  <path d="M40 0V270M120 0V270M200 0V270M280 0V270M360 0V270M440 0V270" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <path d="M0 45H480M0 90H480M0 135H480M0 180H480M0 225H480" stroke="rgba(255,255,255,0.03)" stroke-width="1" />

  <!-- Left: Original Image Card -->
  <g transform="translate(85, 35)">
    <rect width="130" height="130" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    <rect x="10" y="10" width="110" height="85" rx="8" fill="url(#photo-grad)" opacity="0.85" />
    <!-- Mountain illustration -->
    <path d="M20 85L50 45L75 75L90 60L110 85Z" fill="rgba(255,255,255,0.3)" />
    <circle cx="40" cy="35" r="7" fill="#FFFFFF" opacity="0.8" />
    <!-- File label -->
    <rect x="10" y="102" width="40" height="18" rx="4" fill="rgba(255,255,255,0.1)" />
    <text x="30" y="115" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">PNG</text>
    <text x="85" y="115" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">4.8 MB</text>
  </g>

  <!-- Center Compression Arrow & Savings Badge -->
  <g transform="translate(225, 80)">
    <circle cx="15" cy="15" r="22" fill="#EC3D8E" />
    <path d="M7 15H23M23 15L17 9M23 15L17 21" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Right: Compressed WebP Card -->
  <g transform="translate(265, 35)">
    <rect width="130" height="130" rx="14" fill="rgba(255,255,255,0.08)" stroke="#EC3D8E" stroke-width="1.5" />
    <rect x="10" y="10" width="110" height="85" rx="8" fill="url(#photo-grad)" />
    <!-- Mountain illustration -->
    <path d="M20 85L50 45L75 75L90 60L110 85Z" fill="rgba(255,255,255,0.4)" />
    <circle cx="40" cy="35" r="7" fill="#FFFFFF" />
    <!-- File label -->
    <rect x="10" y="102" width="44" height="18" rx="4" fill="#22C55E" />
    <text x="32" y="115" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">WebP</text>
    <text x="85" y="115" fill="#22C55E" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">480 KB</text>
  </g>

  <!-- Floating Savings Badge -->
  <g transform="translate(190, 150)">
    <rect width="100" height="24" rx="12" fill="#22C55E" />
    <text x="50" y="16" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">&minus;90% SAVED</text>
  </g>
</svg>