<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-utm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B0C26" />
      <stop offset="50%" stop-color="#100517" />
      <stop offset="100%" stop-color="#07020A" />
    </linearGradient>
    <radialGradient id="glow-utm" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#EC3D8E" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="270" fill="url(#bg-utm)" />
  <circle cx="240" cy="115" r="140" fill="url(#glow-utm)" />

  <!-- Grid decoration lines -->
  <path d="M40 0V270M120 0V270M200 0V270M280 0V270M360 0V270M440 0V270" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <path d="M0 45H480M0 90H480M0 135H480M0 180H480M0 225H480" stroke="rgba(255,255,255,0.03)" stroke-width="1" />

  <!-- Center URL Card Interface -->
  <g transform="translate(60, 40)">
    <rect width="360" height="120" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
    
    <!-- Top preset pills -->
    <g transform="translate(16, 16)">
      <rect width="70" height="22" rx="11" fill="#EC3D8E" />
      <text x="35" y="15" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Meta Ads</text>

      <rect x="78" width="76" height="22" rx="11" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)" />
      <text x="116" y="15" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Google Ads</text>

      <rect x="162" width="60" height="22" rx="11" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)" />
      <text x="192" y="15" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">TikTok</text>

      <rect x="230" width="70" height="22" rx="11" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)" />
      <text x="265" y="15" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Newsletter</text>
    </g>

    <!-- Code URL Display Box -->
    <g transform="translate(16, 52)">
      <rect width="328" height="52" rx="8" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.12)" />
      <text x="14" y="24" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11">https://yoursite.com/<tspan fill="#EC3D8E">?utm_source=facebook</tspan></text>
      <text x="14" y="40" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11"><tspan fill="#10B981">&amp;utm_medium=paid_social</tspan><tspan fill="#F59E0B">&amp;utm_campaign=q1</tspan></text>
    </g>
  </g>

  <!-- Bottom Analytics Badge -->
  <g transform="translate(170, 155)">
    <rect width="140" height="24" rx="12" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981" stroke-width="1.5" />
    <circle cx="14" cy="12" r="4" fill="#10B981" />
    <text x="76" y="16" fill="#10B981" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">100% GA4 ERROR-FREE</text>
  </g>
</svg>