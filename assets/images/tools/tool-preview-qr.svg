<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-qr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E0E2B" />
      <stop offset="50%" stop-color="#12071C" />
      <stop offset="100%" stop-color="#09030E" />
    </linearGradient>
    <radialGradient id="glow-qr" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#EC3D8E" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#EC3D8E" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC3D8E" stop-opacity="0" />
      <stop offset="50%" stop-color="#EC3D8E" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#EC3D8E" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="270" fill="url(#bg-qr)" />
  <circle cx="240" cy="120" r="140" fill="url(#glow-qr)" />

  <!-- Grid decoration lines -->
  <path d="M40 0V270M120 0V270M200 0V270M280 0V270M360 0V270M440 0V270" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <path d="M0 45H480M0 90H480M0 135H480M0 180H480M0 225H480" stroke="rgba(255,255,255,0.03)" stroke-width="1" />

  <!-- Center QR Plate -->
  <rect x="165" y="30" width="150" height="150" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
  
  <!-- White QR background pad -->
  <rect x="180" y="45" width="120" height="120" rx="10" fill="#FFFFFF" />

  <!-- Top-Left Finder Square -->
  <rect x="190" y="55" width="30" height="30" rx="4" stroke="#0B0612" stroke-width="4.5" fill="none" />
  <rect x="197" y="62" width="16" height="16" rx="2" fill="#EC3D8E" />

  <!-- Top-Right Finder Square -->
  <rect x="260" y="55" width="30" height="30" rx="4" stroke="#0B0612" stroke-width="4.5" fill="none" />
  <rect x="267" y="62" width="16" height="16" rx="2" fill="#EC3D8E" />

  <!-- Bottom-Left Finder Square -->
  <rect x="190" y="125" width="30" height="30" rx="4" stroke="#0B0612" stroke-width="4.5" fill="none" />
  <rect x="197" y="132" width="16" height="16" rx="2" fill="#EC3D8E" />

  <!-- QR Matrix Data Modules -->
  <rect x="228" y="55" width="8" height="8" rx="1.5" fill="#0B0612" />
  <rect x="242" y="55" width="8" height="8" rx="1.5" fill="#EC3D8E" />
  <rect x="228" y="70" width="12" height="6" rx="1" fill="#0B0612" />
  <rect x="245" y="72" width="7" height="7" rx="1" fill="#0B0612" />
  <rect x="228" y="90" width="24" height="6" rx="1" fill="#EC3D8E" />
  <rect x="190" y="95" width="8" height="18" rx="1.5" fill="#0B0612" />
  <rect x="205" y="95" width="15" height="7" rx="1" fill="#0B0612" />
  <rect x="260" y="95" width="12" height="12" rx="2" fill="#0B0612" />
  <rect x="278" y="95" width="12" height="7" rx="1" fill="#EC3D8E" />
  <rect x="228" y="108" width="10" height="18" rx="1.5" fill="#0B0612" />
  <rect x="244" y="112" width="28" height="8" rx="1.5" fill="#0B0612" />
  <rect x="260" y="128" width="14" height="8" rx="1.5" fill="#EC3D8E" />
  <rect x="278" y="126" width="12" height="14" rx="2" fill="#0B0612" />
  <rect x="228" y="138" width="22" height="7" rx="1" fill="#0B0612" />
  <rect x="256" y="145" width="18" height="8" rx="1.5" fill="#0B0612" />

  <!-- Laser Scan Beam -->
  <rect x="160" y="102" width="160" height="3" fill="url(#laser)" />
  <line x1="170" y1="103" x2="310" y2="103" stroke="#FFFFFF" stroke-width="1" opacity="0.8" />

  <!-- Floating Tags / Badges -->
  <g transform="translate(60, 95)">
    <rect width="90" height="26" rx="13" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" />
    <circle cx="15" cy="13" r="4" fill="#22C55E" />
    <text x="26" y="17" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">SVG + PNG</text>
  </g>

  <g transform="translate(330, 80)">
    <rect width="96" height="26" rx="13" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)" />
    <circle cx="15" cy="13" r="4" fill="#EC3D8E" />
    <text x="26" y="17" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">100% Private</text>
  </g>
</svg>