<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-inv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B0C26" />
      <stop offset="50%" stop-color="#100517" />
      <stop offset="100%" stop-color="#07020A" />
    </linearGradient>
    <radialGradient id="glow-inv" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#EC3D8E" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="480" height="270" fill="url(#bg-inv)" />
  <circle cx="240" cy="115" r="140" fill="url(#glow-inv)" />

  <!-- Invoice Sheet Preview -->
  <g transform="translate(140, 25)">
    <rect width="200" height="150" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
    
    <!-- Invoice Header -->
    <rect x="18" y="18" width="55" height="12" rx="3" fill="#EC3D8E" />
    <text x="22" y="27" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="8" font-weight="800">INVOICE</text>
    <text x="140" y="27" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">#INV-2026</text>

    <!-- Line items -->
    <line x1="18" y1="42" x2="182" y2="42" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="18" y="58" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="10">Web Development</text>
    <text x="145" y="58" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">$1,800.00</text>

    <text x="18" y="78" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="10">Automation Setup</text>
    <text x="155" y="78" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">$650.00</text>
    
    <!-- Total Section -->
    <line x1="18" y1="95" x2="182" y2="95" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="18" y="115" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Total Due</text>
    <text x="135" y="116" fill="#10B981" font-family="-apple-system, sans-serif" font-size="13" font-weight="800">$2,450.00</text>
    
    <!-- Paid Stamp -->
    <rect x="18" y="126" width="60" height="16" rx="4" fill="rgba(16,185,129,0.2)" stroke="#10B981" stroke-width="1" />
    <text x="48" y="137" fill="#10B981" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">&check; 1-CLICK PDF</text>
  </g>
</svg>