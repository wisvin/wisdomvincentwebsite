<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B0C26" />
      <stop offset="50%" stop-color="#100517" />
      <stop offset="100%" stop-color="#07020A" />
    </linearGradient>
    <radialGradient id="glow-ai" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#EC3D8E" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="480" height="270" fill="url(#bg-ai)" />
  <circle cx="240" cy="115" r="140" fill="url(#glow-ai)" />

  <!-- AI Tokenizer Monitor Box -->
  <g transform="translate(110, 35)">
    <rect width="260" height="135" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
    
    <!-- Header -->
    <text x="20" y="28" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Claude 3.7 &middot; GPT-4o &middot; Gemini</text>
    
    <!-- Token metrics display -->
    <rect x="18" y="42" width="105" height="45" rx="8" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.1)" />
    <text x="30" y="58" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="9">Total Tokens</text>
    <text x="30" y="77" fill="#FFFFFF" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">4,820</text>

    <rect x="135" y="42" width="105" height="45" rx="8" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.1)" />
    <text x="147" y="58" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="9">Estimated Cost</text>
    <text x="147" y="77" fill="#EC3D8E" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">$0.014</text>

    <!-- Progress bar -->
    <rect x="18" y="100" width="222" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
    <rect x="18" y="100" width="140" height="8" rx="4" fill="url(#glow-ai)" />
    <text x="18" y="122" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="9">38% Context Window Capacity</text>
  </g>
</svg>