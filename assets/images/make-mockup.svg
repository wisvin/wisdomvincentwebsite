<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <rect width="600" height="380" fill="#0F111A"/>
  <!-- Top bar -->
  <rect width="600" height="48" fill="#161927"/>
  <rect x="0" y="48" width="600" height="1" fill="#252A3D"/>
  <!-- Make logo -->
  <rect x="14" y="16" width="16" height="16" rx="3" fill="#3B97D3"/>
  <text x="36" y="29" font-family="sans-serif" font-size="13" fill="white" font-weight="700">Make</text>
  <text x="80" y="29" font-family="sans-serif" font-size="11" fill="#5A6080">New Lead → CRM → Email Sequence</text>
  <!-- Controls right -->
  <rect x="468" y="14" width="56" height="22" rx="4" fill="#1E2436"/>
  <text x="496" y="28" font-family="sans-serif" font-size="10" fill="#9AA3BF" text-anchor="middle">⚙ Settings</text>
  <rect x="532" y="14" width="56" height="22" rx="4" fill="#3B97D3"/>
  <text x="560" y="28" font-family="sans-serif" font-size="10" fill="white" text-anchor="middle">▶ Run</text>
  <!-- Circular connection lines (Make's distinctive style) -->
  <!-- Line 1→2 -->
  <path d="M 186 190 Q 230 190 244 190" stroke="#3B97D3" stroke-width="2" fill="none"/>
  <polygon points="241,185 253,190 241,195" fill="#3B97D3"/>
  <!-- Line 2→3 -->
  <path d="M 356 190 Q 390 190 404 190" stroke="#3B97D3" stroke-width="2" fill="none"/>
  <polygon points="401,185 413,190 401,195" fill="#3B97D3"/>
  <!-- Line 2→4 (branch down) -->
  <path d="M 300 230 Q 300 268 300 276" stroke="#F59E0B" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="295,273 300,285 305,273" fill="#F59E0B"/>
  <!-- Line 3→5 -->
  <path d="M 513 190 Q 547 190 556 190" stroke="#22C55E" stroke-width="2" fill="none"/>
  <polygon points="553,185 565,190 553,195" fill="#22C55E"/>

  <!-- NODE 1: Facebook Ads (circle bubble) -->
  <circle cx="140" cy="190" r="44" fill="#1E2436" stroke="#3B97D3" stroke-width="2"/>
  <text x="140" y="183" font-family="sans-serif" font-size="20" text-anchor="middle">📘</text>
  <text x="140" y="200" font-family="sans-serif" font-size="9" fill="#3B97D3" text-anchor="middle" font-weight="700">Facebook</text>
  <text x="140" y="212" font-family="sans-serif" font-size="8" fill="#9AA3BF" text-anchor="middle">New Lead</text>

  <!-- NODE 2: Router (Make's router node) -->
  <circle cx="300" cy="190" r="44" fill="#1E2436" stroke="#9880FF" stroke-width="2"/>
  <text x="300" y="183" font-family="sans-serif" font-size="18" text-anchor="middle">⑂</text>
  <text x="300" y="200" font-family="sans-serif" font-size="9" fill="#9880FF" text-anchor="middle" font-weight="700">Router</text>
  <text x="300" y="212" font-family="sans-serif" font-size="8" fill="#9AA3BF" text-anchor="middle">2 routes</text>

  <!-- NODE 3: GoHighLevel -->
  <circle cx="460" cy="190" r="44" fill="#1E2436" stroke="#22C55E" stroke-width="2"/>
  <text x="460" y="183" font-family="sans-serif" font-size="20" text-anchor="middle">🚀</text>
  <text x="460" y="200" font-family="sans-serif" font-size="9" fill="#22C55E" text-anchor="middle" font-weight="700">GoHighLevel</text>
  <text x="460" y="212" font-family="sans-serif" font-size="8" fill="#9AA3BF" text-anchor="middle">Add Contact</text>

  <!-- NODE 4 (branch) Slack -->
  <circle cx="300" cy="316" r="38" fill="#1E2436" stroke="#F59E0B" stroke-width="2"/>
  <text x="300" y="311" font-family="sans-serif" font-size="18" text-anchor="middle">💬</text>
  <text x="300" y="327" font-family="sans-serif" font-size="9" fill="#F59E0B" text-anchor="middle" font-weight="700">Slack</text>
  <text x="300" y="339" font-family="sans-serif" font-size="8" fill="#9AA3BF" text-anchor="middle">Notify</text>

  <!-- Sidebar -->
  <rect width="44" height="380" fill="#0A0C14"/>
  <rect x="44" y="0" width="1" height="380" fill="#252A3D"/>
  <text x="22" y="76" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#3B97D3">⊞</text>
  <text x="22" y="112" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#3B3F56">▶</text>
  <text x="22" y="148" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#3B3F56">📋</text>

  <!-- Scenario run info -->
  <rect x="0" y="356" width="600" height="24" fill="#161927"/>
  <rect x="0" y="356" width="600" height="1" fill="#252A3D"/>
  <text x="58" y="373" font-family="sans-serif" font-size="10" fill="#5A6080">Scenario active · Operations: 247 / 10,000</text>
  <rect x="58" y="361" width="160" height="6" rx="3" fill="#1E2436"/>
  <rect x="58" y="361" width="39" height="6" rx="3" fill="#3B97D3"/>
  <text x="490" y="373" font-family="sans-serif" font-size="10" fill="#22C55E">● Scheduled: every 15 min</text>
</svg>
