<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="zapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4F00"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>
    <filter id="nodeDrop" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="#0E1118"/>

  <!-- Top bar -->
  <rect width="600" height="48" fill="#151924"/>
  <line x1="0" y1="48" x2="600" y2="48" stroke="#232A3C" stroke-width="1"/>

  <!-- Zapier Logo / Brand -->
  <rect x="14" y="12" width="24" height="24" rx="5" fill="url(#zapGrad)"/>
  <text x="26" y="29" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">_</text>
  <text x="46" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Zapier</text>

  <!-- Workflow Title & Status -->
  <text x="110" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#8C98B6">Enterprise Lead Routing &amp; Instant Follow-up</text>
  <rect x="504" y="13" width="82" height="22" rx="11" fill="#132B1E" stroke="#10B981" stroke-width="1"/>
  <circle cx="516" cy="24" r="3.5" fill="#10B981"/>
  <text x="548" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#10B981" text-anchor="middle">ON &#183; AUTO</text>

  <!-- Canvas Content -->
  <!-- Connecting Vertical Trunk Line -->
  <line x1="88" y1="90" x2="88" y2="330" stroke="#2A334B" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- STEP 1: TRIGGER -->
  <g transform="translate(48, 62)" filter="url(#nodeDrop)">
    <rect width="504" height="54" rx="10" fill="#181D2B" stroke="#FF4F00" stroke-width="1.2"/>
    <circle cx="40" cy="27" r="16" fill="#FF4F00"/>
    <text x="40" y="32" font-family="sans-serif" font-size="12" font-weight="900" fill="#FFF" text-anchor="middle">1</text>
    <text x="70" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#FF7A00" letter-spacing="0.05em">TRIGGER &#183; WEBHOOK / ADS</text>
    <text x="70" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">New Lead Captured via Facebook Ads &amp; Website Funnel</text>
    <rect x="424" y="16" width="66" height="22" rx="4" fill="#252D42"/>
    <text x="457" y="31" font-family="monospace" font-size="9.5" fill="#9AA7CA" text-anchor="middle">&lt;instant&gt;</text>
  </g>

  <!-- STEP 2: FILTER & QUALIFY -->
  <g transform="translate(48, 130)" filter="url(#nodeDrop)">
    <rect width="504" height="50" rx="10" fill="#181D2B" stroke="#2B344D" stroke-width="1"/>
    <circle cx="40" cy="25" r="14" fill="#232A3E"/>
    <text x="40" y="29" font-family="sans-serif" font-size="11" font-weight="800" fill="#8A97BC" text-anchor="middle">2</text>
    <text x="70" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#8A97BC" letter-spacing="0.05em">FILTER &amp; PATHS</text>
    <text x="70" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="500" fill="#E2E8F0">Only continue if Budget &gt; $3,000 and Work Email is verified</text>
    <text x="444" y="32" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#10B981">&#10003; Qualified</text>
  </g>

  <!-- STEP 3: CRM SYNC -->
  <g transform="translate(48, 194)" filter="url(#nodeDrop)">
    <rect width="504" height="50" rx="10" fill="#181D2B" stroke="#2B344D" stroke-width="1"/>
    <circle cx="40" cy="25" r="14" fill="#2563EB"/>
    <text x="40" y="29" font-family="sans-serif" font-size="11" font-weight="800" fill="#FFF" text-anchor="middle">3</text>
    <text x="70" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#60A5FA" letter-spacing="0.05em">ACTION &#183; CRM INTEGRATION</text>
    <text x="70" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="500" fill="#E2E8F0">Create Deal in HubSpot &amp; Assign Account Executive</text>
    <rect x="424" y="14" width="66" height="22" rx="4" fill="#14241C"/>
    <text x="457" y="29" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#10B981" text-anchor="middle">Synced</text>
  </g>

  <!-- STEP 4: MULTI-TOUCH ENGAGEMENT -->
  <g transform="translate(48, 258)" filter="url(#nodeDrop)">
    <rect width="504" height="50" rx="10" fill="#181D2B" stroke="#2B344D" stroke-width="1"/>
    <circle cx="40" cy="25" r="14" fill="#059669"/>
    <text x="40" y="29" font-family="sans-serif" font-size="11" font-weight="800" fill="#FFF" text-anchor="middle">4</text>
    <text x="70" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#34D399" letter-spacing="0.05em">ACTION &#183; MULTI-CHANNEL OUTREACH</text>
    <text x="70" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="500" fill="#E2E8F0">Dispatch Instant SMS via Twilio &amp; Alert Team in Slack</text>
    <rect x="424" y="14" width="66" height="22" rx="4" fill="#14241C"/>
    <text x="457" y="29" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#10B981" text-anchor="middle">Dispatched</text>
  </g>

  <!-- Bottom Metric Bar -->
  <rect x="48" y="324" width="504" height="40" rx="8" fill="#131724" stroke="#21283B" stroke-width="1"/>
  <text x="64" y="348" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#9AA7CA">📊 Execution Stats: <tspan fill="#10B981" font-weight="700">1,842 runs this month</tspan> &#183; <tspan fill="#FFFFFF">0 errors</tspan> &#183; <tspan fill="#F59E0B">Avg duration: 1.1s</tspan></text>
</svg>

