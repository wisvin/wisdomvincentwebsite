<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC3D8E"/>
      <stop offset="100%" stop-color="#8B1D56"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2438"/>
      <stop offset="100%" stop-color="#171C2E"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC3D8E"/>
      <stop offset="100%" stop-color="#FF5BA3"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Browser background -->
  <rect width="600" height="380" rx="10" fill="#0B0D14"/>

  <!-- Browser window header -->
  <rect width="600" height="36" rx="10" fill="#131722"/>
  <rect y="26" width="600" height="10" fill="#131722"/>
  <line x1="0" y1="36" x2="600" y2="36" stroke="#212738" stroke-width="1"/>

  <!-- Window controls -->
  <circle cx="18" cy="18" r="4.5" fill="#EF4444" opacity="0.85"/>
  <circle cx="32" cy="18" r="4.5" fill="#F59E0B" opacity="0.85"/>
  <circle cx="46" cy="18" r="4.5" fill="#10B981" opacity="0.85"/>

  <!-- URL bar -->
  <rect x="76" y="8" width="280" height="20" rx="5" fill="#0B0D14" stroke="#212738" stroke-width="1"/>
  <path d="M88 18a2.5 2.5 0 0 1 5 0v1h-5v-1z M86 19h9v4h-9z" fill="#10B981" transform="scale(0.85) translate(15, 2)"/>
  <text x="104" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#8E99B8">https://client-business.com/book</text>

  <!-- Web page background mockup -->
  <g opacity="0.35">
    <!-- Navbar -->
    <rect x="24" y="48" width="60" height="12" rx="3" fill="#3B4466"/>
    <rect x="100" y="51" width="30" height="6" rx="2" fill="#252C42"/>
    <rect x="138" y="51" width="36" height="6" rx="2" fill="#252C42"/>
    <rect x="182" y="51" width="32" height="6" rx="2" fill="#252C42"/>
    <!-- Hero headlines -->
    <rect x="24" y="82" width="130" height="14" rx="4" fill="#6B78A4"/>
    <rect x="24" y="102" width="180" height="10" rx="3" fill="#3B4466"/>
    <rect x="24" y="118" width="150" height="8" rx="2" fill="#252C42"/>
    <rect x="24" y="132" width="165" height="8" rx="2" fill="#252C42"/>
    <!-- Metric cards -->
    <rect x="24" y="160" width="86" height="52" rx="6" fill="#151928" stroke="#252C42" stroke-width="1"/>
    <rect x="34" y="172" width="35" height="12" rx="2" fill="#3B4466"/>
    <rect x="34" y="190" width="60" height="6" rx="2" fill="#252C42"/>
    <rect x="120" y="160" width="86" height="52" rx="6" fill="#151928" stroke="#252C42" stroke-width="1"/>
    <rect x="130" y="172" width="45" height="12" rx="2" fill="#3B4466"/>
    <rect x="130" y="190" width="55" height="6" rx="2" fill="#252C42"/>
    <!-- Body cards -->
    <rect x="24" y="226" width="182" height="68" rx="6" fill="#131726" stroke="#212738" stroke-width="1"/>
    <rect x="24" y="306" width="182" height="60" rx="6" fill="#131726" stroke="#212738" stroke-width="1"/>
  </g>

  <!-- ACTIVE AI AGENT CHAT WIDGET (Hero focus) -->
  <g transform="translate(225, 46)" filter="url(#cardShadow)">
    <!-- Chat Window Container -->
    <rect width="355" height="318" rx="12" fill="#121522" stroke="#2C334D" stroke-width="1.2"/>

    <!-- Widget Header -->
    <rect width="355" height="46" rx="12" fill="#181D2E"/>
    <rect y="36" width="355" height="10" fill="#181D2E"/>
    <line x1="0" y1="46" x2="355" y2="46" stroke="#272F47" stroke-width="1"/>

    <!-- Agent Avatar -->
    <rect x="12" y="9" width="28" height="28" rx="7" fill="url(#aiGrad)"/>
    <text x="26" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">AI</text>
    <circle cx="39" cy="36" r="4" fill="#10B981" stroke="#181D2E" stroke-width="1.5"/>

    <!-- Header Titles -->
    <text x="50" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">AI Sales &amp; Booking Agent</text>
    <text x="50" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#10B981">● Active now &#183; Claude 3.5 Sonnet</text>

    <!-- Header actions -->
    <circle cx="335" cy="23" r="3" fill="#65729B"/>

    <!-- MESSAGE 1: User Query -->
    <g transform="translate(70, 58)">
      <rect width="273" height="38" rx="9" fill="#252D47"/>
      <text x="12" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#FFFFFF">We get ~80 leads/day from Google Ads.</text>
      <text x="12" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#FFFFFF">Can this agent qualify them and book calls?</text>
    </g>

    <!-- MESSAGE 2: AI Agent Response -->
    <g transform="translate(12, 104)">
      <!-- AI tiny mark -->
      <rect x="0" y="2" width="16" height="16" rx="4" fill="url(#aiGrad)"/>
      <text x="8" y="13.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="800" fill="#FFF" text-anchor="middle">AI</text>
      
      <!-- Speech bubble -->
      <rect x="22" y="0" width="310" height="52" rx="9" fill="url(#bubbleGrad)" stroke="#272F47" stroke-width="1"/>
      <text x="34" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#E2E8F0">Yes! I qualify visitor budget and intent, answer</text>
      <text x="34" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#E2E8F0">questions in your exact voice, and book confirmed</text>
      <text x="34" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#E2E8F0">discovery calls in your calendar in under 60 seconds.</text>
    </g>

    <!-- INTERACTIVE CALENDAR BOOKING CARD (Inside Chat) -->
    <g transform="translate(34, 162)">
      <rect width="310" height="54" rx="8" fill="#171C2B" stroke="#EC3D8E" stroke-width="1.2"/>
      
      <!-- Calendar Icon -->
      <rect x="10" y="10" width="34" height="34" rx="6" fill="#252D47"/>
      <text x="27" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" text-anchor="middle">📅</text>
      
      <!-- Card text -->
      <text x="52" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Available Discovery Slot</text>
      <text x="52" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">Tomorrow &#183; 2:00 PM EST (15 mins)</text>
      
      <!-- Confirm Button -->
      <rect x="206" y="13" width="94" height="28" rx="6" fill="url(#ctaGrad)"/>
      <text x="253" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Confirm Slot &#8594;</text>
    </g>

    <!-- AUTOMATION PIPELINE CONFIRMATION PILL -->
    <g transform="translate(34, 224)">
      <rect width="310" height="36" rx="6" fill="#0E1E17" stroke="#10B981" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="16" cy="18" r="4" fill="#10B981"/>
      <text x="26" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#10B981">⚡ BACKEND AUTOMATION TRIGGERED</text>
      <text x="26" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#86EFAC">Lead Scored: 95 (Hot) &#183; Synced to GoHighLevel CRM &#183; Calendar held</text>
    </g>

    <!-- Input Footer -->
    <rect y="268" width="355" height="50" rx="12" fill="#151928"/>
    <rect y="268" width="355" height="10" fill="#151928"/>
    <line x1="0" y1="268" x2="355" y2="268" stroke="#232A3E" stroke-width="1"/>
    
    <rect x="12" y="278" width="290" height="30" rx="7" fill="#0D0F17" stroke="#252D44" stroke-width="1"/>
    <text x="24" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#5F6D94">Ask about pricing, integrations, or book...</text>
    
    <rect x="310" y="278" width="34" height="30" rx="7" fill="url(#aiGrad)"/>
    <path d="M322 293 l10 -5 l-10 -5 v3.5 l6 1.5 l-6 1.5 z" fill="#FFFFFF"/>
  </g>
</svg>

