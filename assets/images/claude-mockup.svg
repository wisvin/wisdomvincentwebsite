  <rect x="312" y="68" width="264" height="52" rx="10" fill="#1E2130"/>
  <text x="444" y="89" font-family="sans-serif" font-size="10" fill="#9AA3BF" text-anchor="middle">User</text>
  <text x="324" y="104" font-family="sans-serif" font-size="10" fill="#D4D8F0">Extract all contact fields from</text>
  <text x="324" y="117" font-family="sans-serif" font-size="10" fill="#D4D8F0">this uploaded PDF contract.</text>
  <!-- AI response -->
  <text x="213" y="146" font-family="sans-serif" font-size="10" fill="#CC785C" font-weight="700">⬡ Claude</text>
  <rect x="212" y="155" width="350" height="140" rx="10" fill="#13161E" stroke="#222639" stroke-width="1"/>
  <text x="226" y="175" font-family="sans-serif" font-size="10" fill="#D4D8F0">Here are the extracted contact fields:</text>
  <!-- Code block -->
  <rect x="220" y="183" width="330" height="100" rx="6" fill="#0A0C12"/>
