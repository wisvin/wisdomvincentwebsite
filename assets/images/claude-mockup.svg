  <rect x="210" y="314" width="370" height="44" rx="10" fill="#1E2130" stroke="#333850" stroke-width="1"/>
  <text x="228" y="341" font-family="sans-serif" font-size="11" fill="#4A5070">Message Claude…</text>
  <rect x="550" y="323" width="22" height="26" rx="5" fill="#CC785C"/>
