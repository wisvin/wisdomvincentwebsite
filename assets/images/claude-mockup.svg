  <text x="232" y="216" font-family="monospace" font-size="9" fill="#F8F8F2">{</text>
  <text x="240" y="230" font-family="monospace" font-size="9" fill="#A6E22E">  "party_name"</text>
  <text x="330" y="230" font-family="monospace" font-size="9" fill="#F8F8F2">: </text>
  <text x="340" y="230" font-family="monospace" font-size="9" fill="#E6DB74">"Acme Corp Ltd"</text>
  <text x="240" y="244" font-family="monospace" font-size="9" fill="#A6E22E">  "contact_email"</text>
  <text x="337" y="244" font-family="monospace" font-size="9" fill="#F8F8F2">: </text>
  <text x="347" y="244" font-family="monospace" font-size="9" fill="#E6DB74">"james@acme.com"</text>
  <text x="240" y="258" font-family="monospace" font-size="9" fill="#A6E22E">  "signed_date"</text>
  <text x="321" y="258" font-family="monospace" font-size="9" fill="#F8F8F2">: </text>
  <text x="331" y="258" font-family="monospace" font-size="9" fill="#E6DB74">"2024-11-03"</text>
  <text x="232" y="272" font-family="monospace" font-size="9" fill="#F8F8F2">}</text>
